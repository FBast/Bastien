# Build Windows d'un projet Unreal Engine sur un runner GitHub auto-hébergé.
#
# Déclencheurs :
#   - push sur main     → build Development publié en pré-release « build-N »
#   - push d'un tag v*   → build Shipping publié en release officielle
#   - lancement manuel   → build en artefact seulement (7 jours), configuration au choix
#
# Prérequis sur la machine du runner (labels self-hosted, Windows, X64) :
#   - Unreal Engine installé via l'Epic Launcher, dans la version du .uproject (détectée seule).
#     Moteur compilé depuis les sources ou installé ailleurs : variable de dépôt UE_ROOT.
#   - Visual Studio avec « Développement Desktop en C++ » : nécessaire pour un projet C++,
#     et pour un projet Blueprint qui active des plugins hors défaut.
#   - Projet C++ : Unreal Editor fermé (ou Live Coding désactivé) sur cette machine pendant le
#     build. Live Coding bloque toute compilation sur la même installation du moteur.
#   Git n'a pas à être installé : sans Git utilisable, une version portable est téléchargée.
#
# Variables de dépôt facultatives (Settings → Secrets and variables → Actions → Variables) :
#   - UE_ROOT  : dossier du moteur, ex. D:\Epic\UE_5.6
#   - UPROJECT : chemin du .uproject s'il n'est pas seul à la racine du dépôt
#
# ⚠ Dépôt public : régler Settings → Actions → General → « Require approval for all external
#   contributors ». Une PR venue d'un fork peut apporter son propre workflow et l'exécuter
#   sur le runner ; ce fichier n'a volontairement pas de déclencheur pull_request.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      config:
        description: Configuration du build
        type: choice
        options: [Development, Shipping]
        default: Development

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    permissions:
      contents: write     # création des releases et de leurs tags
    env:
      CONFIG: ${{ startsWith(github.ref, 'refs/tags/v') && 'Shipping' || inputs.config || 'Development' }}
      UE_ROOT_OVERRIDE: ${{ vars.UE_ROOT }}
      UPROJECT_OVERRIDE: ${{ vars.UPROJECT }}

    steps:
      # Le runner tourne souvent sous un compte de service qui ne voit pas le Git de l'utilisateur
      # (installé dans son profil). Sans Git + LFS utilisable, Git for Windows portable est
      # téléchargé une fois dans le cache d'outils du runner : ni installation ni droits admin.
      - name: Préparer Git
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ok = $false
          try {
            git --version | Out-Null
            if ($LASTEXITCODE -eq 0) { git lfs version | Out-Null; $ok = ($LASTEXITCODE -eq 0) }
          } catch { }
          if ($ok) { Write-Host "Git présent : $((Get-Command git).Source)"; exit 0 }

          $root = Join-Path $env:RUNNER_TOOL_CACHE 'PortableGit'
          if (-not (Test-Path (Join-Path $root 'cmd\git.exe'))) {
            $ProgressPreference = 'SilentlyContinue'
            [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
            $release = Invoke-RestMethod -UseBasicParsing -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
              -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
            $asset = $release.assets | Where-Object { $_.name -match '^PortableGit-.*-64-bit\.7z\.exe$' } | Select-Object -First 1
            $sfx = Join-Path $env:RUNNER_TEMP $asset.name
            Write-Host "Téléchargement de $($asset.name)"
            Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $sfx
            Start-Process -FilePath $sfx -ArgumentList '-y', "-o`"$root`"" -Wait -NoNewWindow
            Remove-Item $sfx
          }
          Join-Path $root 'cmd' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Git portable : $root"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false        # garde DerivedDataCache/ et Intermediate/ : build et cook incrémentaux
          lfs: true
          fetch-depth: 1

      # Expose PROJECT_FILE, PROJECT_NAME, UE_ROOT et IS_CODE_PROJECT aux étapes suivantes.
      - name: Détecter le projet et le moteur
        shell: powershell
        run: |
          if ($env:UPROJECT_OVERRIDE) {
            $uproject = Get-Item (Join-Path $env:GITHUB_WORKSPACE $env:UPROJECT_OVERRIDE)
          } else {
            $found = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.uproject -File)
            if ($found.Count -ne 1) {
              Write-Error "$($found.Count) fichier(s) .uproject à la racine. Indiquer le bon via la variable de dépôt UPROJECT."
              exit 1
            }
            $uproject = $found[0]
          }
          $projectDir = $uproject.DirectoryName

          if ($env:UE_ROOT_OVERRIDE) {
            $ueRoot = $env:UE_ROOT_OVERRIDE
          } else {
            # Version Launcher (ex. "5.6") ; un GUID ou une valeur vide désigne un moteur source.
            $assoc = (Get-Content $uproject.FullName -Raw | ConvertFrom-Json).EngineAssociation
            if ($assoc -notmatch '^\d+\.\d+$') {
              Write-Error "EngineAssociation « $assoc » n'est pas une version Launcher. Indiquer le moteur via la variable de dépôt UE_ROOT."
              exit 1
            }
            $ueRoot = "C:\Program Files\Epic Games\UE_$assoc"
            $manifest = 'C:\ProgramData\Epic\UnrealEngineLauncher\LauncherInstalled.dat'
            if (Test-Path $manifest) {
              $install = (Get-Content $manifest -Raw | ConvertFrom-Json).InstallationList |
                Where-Object { $_.AppName -eq "UE_$assoc" } | Select-Object -First 1
              if ($install) { $ueRoot = $install.InstallLocation }
            }
          }
          if (-not (Test-Path (Join-Path $ueRoot 'Engine\Build\BatchFiles\RunUAT.bat'))) {
            Write-Error "Moteur introuvable dans « $ueRoot ». Installer la bonne version ou régler la variable de dépôt UE_ROOT."
            exit 1
          }

          # Projet C++ = des modules à lui (Source/ ou plugin du projet avec Source/).
          $isCode = (Test-Path (Join-Path $projectDir 'Source')) -or
            [bool](Get-ChildItem -Path (Join-Path $projectDir 'Plugins') -Directory -Recurse -Filter Source -ErrorAction SilentlyContinue)

          "PROJECT_FILE=$($uproject.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_NAME=$($uproject.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UE_ROOT=$ueRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_CODE_PROJECT=$isCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Projet : $($uproject.FullName) (C++ : $isCode)"
          Write-Host "Moteur : $ueRoot"

      - name: Vérifier que Live Coding est inactif
        if: env.IS_CODE_PROJECT == 'True'
        shell: powershell
        run: |
          if (Get-Process -Name LiveCodingConsole -ErrorAction SilentlyContinue) {
            Write-Error "Live Coding est actif sur cette machine : Unreal refuse alors de compiler. Fermer Unreal Editor (ou Ctrl+Alt+F11 dans l'éditeur) puis relancer le build."
            exit 1
          }

      - name: Build, cook, package
        shell: powershell
        # Projet Blueprint : on cuisine avec l'éditeur du moteur. Sans ça, un plugin hors défaut
        # fait traiter le projet comme « code » et UAT réclame un <Projet>Editor.target jamais compilé.
        # Projet C++ : UAT compile l'éditeur du projet et cuisine avec.
        # Le cache DDC Zen ne démarre pas toujours sous le compte de service du runner :
        # on cuisine avec le cache fichier local.
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $uatArgs = @(
            'BuildCookRun',
            "-project=$env:PROJECT_FILE",
            '-platform=Win64',
            "-clientconfig=$env:CONFIG",
            '-build', '-cook', '-stage', '-pak', '-iostore', '-compressed',
            '-archive', "-archivedirectory=$env:RUNNER_TEMP\Package",
            '-ddc=InstalledNoZenLocalFallback',
            '-nop4', '-unattended', '-utf8output'
          )
          if ($env:IS_CODE_PROJECT -ne 'True') {
            $uatArgs += "-unrealexe=$(Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe')"
            $uatArgs += '-nocompileeditor'
          }
          & $uat @uatArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zipper le build
        id: zip
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "$env:PROJECT_NAME-Win64-$env:CONFIG.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$env:RUNNER_TEMP\Package", $zip, 'Optimal', $false)
          # L'action de release lit un motif glob : l'antislash y est un caractère d'échappement.
          "path=$($zip -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Pré-release de main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PROJECT_NAME }} build ${{ github.run_number }} (${{ env.CONFIG }})
          body: Build automatique de ${{ github.sha }}.
          prerelease: true
          files: ${{ steps.zip.outputs.path }}
          fail_on_unmatched_files: true

      - name: Release du tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PROJECT_NAME }} ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.zip.outputs.path }}
          fail_on_unmatched_files: true

      - name: Publier le build (lancement manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Win64-${{ env.CONFIG }}-${{ github.sha }}
          path: ${{ runner.temp }}\Package
          retention-days: 7
          if-no-files-found: error

      # Avec un moteur du Launcher, UAT écrit ses logs dans %APPDATA% (Program Files est en lecture seule).
      - name: Rassembler les logs
        if: failure()
        shell: powershell
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'Logs'
          New-Item -ItemType Directory -Force $dst | Out-Null
          $uatLogs = Join-Path $env:APPDATA 'Unreal Engine\AutomationTool\Logs'
          if (Test-Path $uatLogs) { Copy-Item -Recurse -Force $uatLogs (Join-Path $dst 'UAT') }
          if ($env:PROJECT_FILE) {
            $projectLogs = Join-Path (Split-Path $env:PROJECT_FILE) 'Saved\Logs'
            if (Test-Path $projectLogs) { Copy-Item -Recurse -Force $projectLogs (Join-Path $dst 'Project') }
          }

      - name: Publier les logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ${{ runner.temp }}\Logs
          if-no-files-found: ignore
