# Package Windows de Bastien (UE 5.6, projet Blueprint) sur le runner auto-hébergé.
# - push sur main     → build Development publié en pré-release « build-N »
# - push d'un tag v*   → build Shipping publié en release officielle
# - lancement manuel   → build en artefact seulement (7 jours)
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      config:
        description: Configuration du build
        type: choice
        options: [Development, Shipping]
        default: Development

# Dépôt public + runner auto-hébergé : pas de déclencheur pull_request,
# sinon une PR venue d'un fork exécute son code sur la machine.

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    permissions:
      contents: write     # création des releases et de leurs tags
    env:
      # Autre chemin moteur : variable de dépôt UE_ROOT (Settings → Secrets and variables → Actions → Variables)
      UE_ROOT: ${{ vars.UE_ROOT || 'C:\Program Files\Epic Games\UE_5.6' }}
      CONFIG: ${{ startsWith(github.ref, 'refs/tags/v') && 'Shipping' || inputs.config || 'Development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false        # garde DerivedDataCache/ et Intermediate/ : cook incrémental
          lfs: false          # passer à true le jour où le dépôt utilise Git LFS
          fetch-depth: 1

      - name: Vérifier le moteur
        shell: powershell
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $uat)) {
            Write-Error "RunUAT introuvable : $uat. Régler UE_ROOT (variable de dépôt ou .env du runner)."
            exit 1
          }

      - name: Build, cook, package
        shell: powershell
        # GameplayStateTree fait traiter le projet comme « code » : UAT chercherait alors un
        # BastienEditor.target qui n'existe pas. Le projet n'a aucun module C++, on cuisine
        # donc avec l'éditeur du moteur, passé explicitement.
        # Le service Zen (cache DDC par défaut) ne démarre pas sous le compte du runner :
        # on cuisine avec le cache fichier local à la place.
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          & $uat BuildCookRun `
            "-project=$env:GITHUB_WORKSPACE\Bastien.uproject" `
            -platform=Win64 `
            "-clientconfig=$env:CONFIG" `
            -build -cook -stage -pak -iostore -compressed `
            -archive "-archivedirectory=$env:RUNNER_TEMP\Package" `
            "-unrealexe=$editor" `
            -ddc=InstalledNoZenLocalFallback `
            -nocompileeditor -nop4 -unattended -utf8output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zipper le build
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "Bastien-Win64-$env:CONFIG.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$env:RUNNER_TEMP\Package", $zip, 'Optimal', $false)

      - name: Pré-release de main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ env.CONFIG }})
          body: Build automatique de ${{ github.sha }}.
          prerelease: true
          files: ${{ runner.temp }}\Bastien-Win64-${{ env.CONFIG }}.zip
          fail_on_unmatched_files: true

      - name: Release du tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bastien ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: ${{ runner.temp }}\Bastien-Win64-${{ env.CONFIG }}.zip
          fail_on_unmatched_files: true

      - name: Publier le build (lancement manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Bastien-Win64-${{ env.CONFIG }}-${{ github.sha }}
          path: ${{ runner.temp }}\Package
          retention-days: 7
          if-no-files-found: error

      # Avec un moteur du Launcher, UAT écrit ses logs dans %APPDATA% (Program Files est en lecture seule).
      - name: Rassembler les logs
        if: failure()
        shell: powershell
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'Logs'
          New-Item -ItemType Directory -Force $dst | Out-Null
          $uatLogs = Join-Path $env:APPDATA 'Unreal Engine\AutomationTool\Logs'
          if (Test-Path $uatLogs) { Copy-Item -Recurse -Force $uatLogs (Join-Path $dst 'UAT') }
          if (Test-Path 'Saved\Logs') { Copy-Item -Recurse -Force 'Saved\Logs' (Join-Path $dst 'Project') }

      - name: Publier les logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ${{ runner.temp }}\Logs
          if-no-files-found: ignore
